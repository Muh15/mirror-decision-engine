name: MIRROR mobile polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply mobile polish') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* MIRROR_MOBILE_POLISH_V2 */'
          if marker not in text:
              style = r'''
              <style>
              /* MIRROR_MOBILE_POLISH_V2 */
              @media (max-width:600px){
                .workspace-head{padding:16px 14px 12px}
                .run{padding:12px 14px;font-size:15px;border-radius:13px;min-height:52px}
                .map{height:290px}
                .map svg text{display:none!important}
                .map-event{left:12px;right:auto;top:12px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
                .legend{left:10px;bottom:10px;max-width:calc(100% - 20px);gap:7px;padding:7px 8px}
                .metrics{padding:10px;gap:7px}
                .metric{padding:10px}
              }
              @media (max-width:380px){
                .map{height:275px}
                .run{font-size:14px}
                .legend{font-size:8px}
                .map-event{max-width:75vw}
              }
              </style>
              '''
              text = text.replace('</head>', style + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit polish and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/mobile-polish.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: apply mobile polish"
          git push