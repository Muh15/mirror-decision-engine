name: MIRROR map label polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply map label polish') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile map labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'MIRROR_MAP_LABEL_POLISH_V1'
          if marker not in text:
              style = r'''
<style>
/* MIRROR_MAP_LABEL_POLISH_V1 */
.maplabel{
  position:absolute;
  z-index:4;
  padding:5px 8px;
  border:1px solid #294963;
  border-radius:9px;
  background:#061522e8;
  color:#b9cddd;
  font-size:9px;
  line-height:1.2;
  white-space:nowrap;
  pointer-events:none;
  box-shadow:0 5px 18px #0004;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}
.maplabel.mc{right:12px;top:12px}
.maplabel.ma{right:12px;top:45px}
.maplabel.mb{right:12px;top:78px}
@media(max-width:600px){
  .maplabel{font-size:8px;padding:4px 7px;border-radius:8px}
  .maplabel.mc{right:12px;top:12px}
  .maplabel.ma{right:12px;top:43px}
  .maplabel.mb{right:12px;top:74px}
  .map-event{top:108px!important;left:12px!important;right:auto!important;max-width:calc(100% - 24px)!important}
  .workspace-head h2{font-size:20px}
  .workspace-head p{font-size:11px}
}
@media(max-width:380px){
  .maplabel{font-size:7px;padding:4px 6px}
  .maplabel.mc{top:10px}.maplabel.ma{top:39px}.maplabel.mb{top:68px}
  .map-event{top:101px!important;font-size:8px}
}
</style>
'''
              text = text.replace('</head>', style + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/map-label-polish.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: apply map label polish"
          git push
