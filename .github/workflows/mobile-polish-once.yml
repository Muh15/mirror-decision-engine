name: MIRROR mobile polish once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'MIRROR_MOBILE_POLISH_V3'
          if marker not in text:
              style = '''\n<style>\n/* MIRROR_MOBILE_POLISH_V3 */\n@media (max-width:600px){\n  .workspace-head{padding:16px 14px 12px}\n  .run{padding:12px 14px;font-size:15px;border-radius:13px;min-height:52px}\n  .map{height:290px}\n  .map svg text{display:none!important}\n  .map-event{left:12px;right:auto;top:12px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .legend{left:10px;bottom:10px;max-width:calc(100% - 20px);gap:7px;padding:7px 8px}\n  .metrics{padding:10px;gap:7px}\n  .metric{padding:10px}\n}\n@media (max-width:380px){\n  .map{height:275px}\n  .run{font-size:14px}\n  .legend{font-size:8px}\n  .map-event{max-width:75vw}\n}\n</style>\n'''
              text = text.replace('</head>', style + '</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "chore: apply mobile polish" && git push)